<!doctype html>
<meta charset="utf-8">
<!--
  The showcase banner: Preview-source.png with the title engraved over it. Render at 896x504, the
  size Steam and the in-game mod list both want:

    chrome --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1 \
           --window-size=896,504 \
           --screenshot=Mod/About/Preview.png Art/Preview-text.html

  Chrome wants a file:// URL with an absolute path. Handed a relative one it treats the first
  segment as a hostname, looks it up, and screenshots the DNS error page instead - which renders
  and writes a file, so nothing fails.

  THE SOURCE needs no crop. 1672x941 scaled to 896 wide is 504.4 high, so the background sits at
  0,0 and the spare half pixel falls off the bottom. Engrave from the full-resolution source and
  never from the reduced Preview.png: the glyphs are composed at final size and are never
  resampled.

  THE TITLE runs to three lines, which is one more than the family usually takes. Two were tried
  first, at 46px, broken as "Halloween" over "Monster Mash Renew". The second line reached x=520,
  and what is at x=500 is the left-hand bedsheet ghost: 3.76:1 behind the tail of "Renew", under
  the 4.5:1 floor. Widening the veil far enough to cover it fogs the picture. Breaking the name
  across three lines instead keeps every line short of x=352, well clear of both ghosts, and costs
  nothing but 44px in place of 46.

  THE VEIL is no longer black. Under the 2026-09-12 rule it takes a colour out of the picture and
  the ink follows from it:

    #372518 is the jack-o-lantern's shaded base, the mean of the source between 1360,660 and
            1470,700, desaturated a fifth of the way to its own grey. WCAG relative luminance
            0.022, well under the 0.18 that decides the ink.
    ink     the light pair: #F2ECE1 for the title, #D8CFC0 for the summary.
    shadow  kept, as a dark veil's shadow is: it lifts the glyphs off the scene showing through.
    rule    stays amber #D68F2C. The exception is for a veil that is itself amber, and this one
            is a shadowed brown - hue 25 degrees, near enough the shadowed straw Creatures of Ki
            engraved on, which kept the amber too.

  WHY NOT A BRIGHTER ORANGE, which is the obvious choice for a Halloween mod. Four were sampled
  off the pumpkin and every one of them is brighter than the room it would cover. The lit flank
  (#7C431C, L=0.080) was rendered: at .90 it does not read as shade but as fog, because a veil
  lighter than the scene lifts the blacks instead of deepening them. The spider vanished, both
  pawns went to orange silhouettes, and the whole frame came up one flat brown. On a night scene
  lit by a single lamp the veil has to be at or below the scene's own darkness - the floor behind
  the text measures L=0.026, and this veil sits at 0.022. What it must not be is the same black as
  the other fifty-four, and at 20,20 it reads #342419.

  THE REACH is 720 by 580, wider than the rule's stated dark-veil form, which dies at 74% of the
  diagonal. Three narrower ellipses were measured and the same point failed each time - the far
  end of the summary's first line, at 424,252, where the lit corner of the table comes up under
  the word "six": 4.19:1 at 660x440, 4.58:1 at 680x500. At 720x580 it is 5.08:1, and the spider,
  the ghosts, the lamp pool and the standing pawn all survive. If the summary is ever reworded so
  that its first line runs past x=424, measure again.

  Measured on the render and not on this stylesheet: the veil is translucent, so what is behind a
  glyph is not the colour in the CSS. Render a second time with .text{display:none}, read the
  pixels across each line's box, and take the worst.
-->
<style>
  html,body { margin:0; padding:0; }
  .frame {
    position:relative; width:896px; height:504px; overflow:hidden;
    background-image:url('Preview-source.png');
    background-repeat:no-repeat;
    background-size:896px auto;
    background-position:0px 0px;
  }
  .shade {
    position:absolute; inset:0;
    background:radial-gradient(ellipse 720px 580px at top left,
                               rgba(55,37,24,.90) 0%,
                               rgba(55,37,24,.86) 42%,
                               rgba(55,37,24,0) 100%);
  }
  .text { position:absolute; left:48px; top:52px; font-family:"Segoe UI",sans-serif; }
  h1 {
    margin:0; font-size:44px; font-weight:700; line-height:1.08;
    color:#F2ECE1; letter-spacing:.2px; text-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  .rule { width:58px; height:3px; background:#D68F2C; margin:18px 0 13px 0; }
  p {
    margin:0; width:430px; font-size:21px; line-height:1.5;
    color:#D8CFC0; text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
</style>
<div class="frame">
  <div class="shade"></div>
  <div class="text">
    <h1>Halloween<br>Monster Mash<br>Renew</h1>
    <div class="rule"></div>
    <p>Eleven masks, seven decorations and six Halloween sweets.</p>
  </div>
</div>
