<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Halloween Monster Mash Renew — Workshop preview</title>
<!-- Render with scripts/Render-Preview.cjs. Palette comes from preview-palette.json.
     The original illustration is preserved in Preview-source.png.
     Brown veil and warm gold secondary ink follow the wood and lamplight;
     the vivid coral accent follows the red devil mask, separate from the gold.
     The renderer waits for the palette, image and Segoe UI font before capturing. -->
<style>
  html, body { margin: 0; padding: 0; }
  .frame {
    position: relative; width: 896px; height: 504px; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: url('Preview-source.png') no-repeat 0 0 / 896px auto;
  }
  .shade {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 760px 580px at top left,
      rgb(var(--veil-rgb) / .94) 0%, rgb(var(--veil-rgb) / .90) 42%,
      rgb(var(--veil-rgb) / 0) 100%);
  }
  .text { position: absolute; left: 50px; top: 54px; }
  h1, p { margin: 0; }
  h1, .tag, .summary { text-shadow: 0 3px 10px rgb(0 0 0 / .75); }
  h1 {
    font-size: 40px; font-weight: 600; line-height: 1.1;
    letter-spacing: 0; color: var(--inkPrimary);
  }
  .suffix { font-size: .65em; color: var(--inkSecondary); }
  .tag {
    margin-top: 8px; font-size: 24px; font-weight: 400;
    line-height: 1.1; letter-spacing: .2px; color: var(--inkSecondary);
  }
  .rule { width: 58px; height: 3px; margin: 20px 0 16px; background: var(--accent); }
  .summary {
    width: 430px; font-size: 21px; font-weight: 400;
    line-height: 1.45; letter-spacing: 0; color: var(--inkPrimary);
  }
  .badge {
    position: absolute; right: 0; top: 0; width: 80px; height: 80px;
    background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%);
  }
  .version {
    position: absolute; left: 869px; top: 27px;
    transform: translate(-50%, -50%) rotate(45deg);
    font-size: 26px; line-height: 1; font-weight: 700; color: var(--badgeInk);
  }
</style>
<div class="frame">
  <div class="shade"></div>
  <div class="text">
    <h1><span class="title-line">Halloween</span><br><span class="title-line">Monster Mash</span> <span class="suffix">Renew</span></h1>
    <p class="tag">(unofficial)</p>
    <div class="rule"></div>
    <p class="summary">Eleven masks, seven decorations and six Halloween sweets.</p>
  </div>
  <div class="badge"></div>
  <div class="version">1.6</div>
</div>
<script>
  window.previewReady = (async () => {
    const response = await fetch('preview-palette.json');
    if (!response.ok) throw new Error('Could not load preview palette');
    const palette = await response.json();
    for (const key of ['veil', 'inkPrimary', 'inkSecondary', 'accent', 'badgeInk']) {
      if (!/^#[0-9A-F]{6}$/i.test(palette[key])) throw new Error('Invalid palette field: ' + key);
      document.documentElement.style.setProperty('--' + key, palette[key]);
    }
    const rgb = palette.veil.match(/[0-9A-F]{2}/ig).map(x => parseInt(x, 16)).join(' ');
    document.documentElement.style.setProperty('--veil-rgb', rgb);
    const background = new Image();
    background.src = 'Preview-source.png';
    await background.decode();
    await document.fonts.ready;
    return palette;
  })();
</script>
</html>
